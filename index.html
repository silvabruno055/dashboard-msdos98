<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Baralho do Conhecimento</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse para ler o CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at center, #0f5132 0%, #062c19 100%);
            color: #e2e8f0;
            user-select: none;
        }

        /* Estrutura 3D da Carta */
        .playing-card {
            position: absolute;
            width: 80px;
            height: 112px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            font-family: 'Crimson Text', serif;
            transform-origin: center center;
        }

        .playing-card:not(.is-open):hover {
            box-shadow: -5px 10px 20px rgba(0,0,0,0.6), 0 0 15px rgba(255,215,0,0.5);
            margin-top: -5px; 
            transform: scale(1.05) !important; 
        }

        /* ESTADO ABERTO (Leitura no Centro do Ecrã) */
        .playing-card.is-open {
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(4.5) rotateY(180deg) !important;
            z-index: 99999 !important;
            cursor: default;
            margin-top: 0 !important;
        }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            border-radius: 6px;
            backface-visibility: hidden;
            background-color: white;
            box-shadow: -2px 4px 8px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(0,0,0,0.1);
        }

        .card-front {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-sizing: border-box;
        }

        .card-top-left, .card-bottom-right {
            display: flex; flex-direction: column; align-items: center;
            line-height: 1; font-size: 11px; font-weight: bold; width: 26px;
        }
        
        .card-center {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            font-size: 32px; opacity: 0.8;
        }

        .card-bottom-right {
            align-self: flex-end; transform: rotate(180deg);
        }

        /* TRÁS DA CARTA */
        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
            border-radius: 6px;
            overflow: hidden; 
        }

        /* Wrapper gigante para manter a proporção da fonte original perfeita na escala de 4.5 */
        .card-back-wrapper {
            width: 360px;  
            height: 504px; 
            transform: scale(calc(1 / 4.5)); 
            transform-origin: top left;
            background: #f8fafc;
            color: #334155;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Área de Scroll */
        .abstract-text {
            flex-grow: 1;
            min-height: 0; 
            overflow-y: auto;
            pointer-events: auto; 
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: justify;
            overscroll-behavior: contain; 
            padding-right: 12px;
            font-size: 14px; 
            line-height: 1.6;
        }

        .abstract-text::-webkit-scrollbar { width: 6px; }
        .abstract-text::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 6px; }

        /* Tooltip flutuante */
        #tooltip {
            position: fixed; opacity: 0; pointer-events: none; z-index: 9998;
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); border-radius: 8px; padding: 12px;
            max-width: 320px; transition: opacity 0.2s; color: white;
            transform: translate(-50%, -110%);
        }

        /* Menus */
        .glass-panel {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .casino-btn {
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            border: 1px solid #475569; color: #f8fafc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .casino-btn:hover {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        .casino-btn.active { border-color: #fbbf24; color: #fbbf24; }

        .upload-pattern {
            background-color: #062c19; background-image: radial-gradient(#0f5132 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* Transição fluída da Legenda */
        #legend-container {
            transition: top 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        right 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        bottom 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Ecrã de Upload -->
    <div id="upload-section" class="absolute inset-0 flex items-center justify-center z-50 upload-pattern transition-opacity duration-700">
        <div class="bg-black/50 backdrop-blur-md p-12 max-w-xl w-full mx-4 text-center rounded-3xl border border-white/10 shadow-2xl cursor-pointer hover:bg-black/60 transition-colors duration-300" id="drop-zone">
            <div class="flex justify-center space-x-2 mb-6 text-4xl">
                <span class="text-red-500">♥️</span><span class="text-white">♠️</span>
                <span class="text-amber-500">⭐</span><span class="text-white">♣️</span>
            </div>
            <h1 class="text-4xl font-bold text-yellow-400 mb-2 font-serif tracking-wide">O Baralho Académico</h1>
            <p class="text-slate-300 mb-8">Arraste o seu CSV para revelar as cartas.</p>
            
            <div class="border-2 border-dashed border-slate-500 rounded-xl p-8 bg-black/30">
                <p class="text-slate-300">Clique aqui para carregar<br><span class="font-mono text-sm text-yellow-400 mt-2 block">humanidades_digitais_def.csv</span></p>
                <input type="file" id="file-input" accept=".csv" class="hidden">
            </div>
        </div>
    </div>

    <!-- Interface da Mesa -->
    <div id="dashboard-section" class="absolute inset-0 z-10 flex flex-col opacity-0 pointer-events-none transition-opacity duration-1000">
        
        <!-- Backdrop para Foco da Carta -->
        <div id="card-backdrop" class="fixed inset-0 bg-black/80 z-[99998] opacity-0 pointer-events-none transition-opacity duration-500" onclick="closeAllCards(event)"></div>

        <header class="glass-panel p-4 flex justify-between items-center z-20 pointer-events-auto">
            <div>
                <h1 class="text-2xl font-bold text-yellow-500 font-serif tracking-wider">
                    <i class="fa-solid fa-crown mr-2"></i> Mesa Principal
                </h1>
                <p class="text-xs text-slate-300" id="data-warning">A distribuir cartas...</p>
            </div>
            
            <div class="flex space-x-3">
                <button class="casino-btn active px-4 py-2 rounded-lg text-sm font-semibold flex items-center" data-group="table">
                    <i class="fa-solid fa-shuffle mr-2"></i> Espalhar na Mesa
                </button>
                <button class="casino-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center" data-group="suit">
                    <span class="mr-2 text-red-400">♠️⭐</span> Por Naipe (Instituição)
                </button>
                <button class="casino-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center" data-group="year">
                    <i class="fa-solid fa-timeline mr-2 text-yellow-400"></i> Por Linha do Tempo (Anos)
                </button>
            </div>
        </header>

        <!-- Mesa de Feltro -->
        <div id="table-container" class="flex-grow w-full relative overflow-hidden" onclick="closeAllCards(event)">
            <!-- Camada para marcações na mesa -->
            <div id="table-markings" class="absolute inset-0 pointer-events-none z-0"></div>
            <!-- Cartas inseridas via JS -->
        </div>

        <!-- Tooltip -->
        <div id="tooltip">
            <p id="tt-ranksuit" class="text-xs font-bold uppercase tracking-widest text-yellow-400 mb-1">2020 ♥️</p>
            <p id="tt-title" class="font-semibold text-white text-sm leading-tight">Título do Documento</p>
            <!-- Autor na tooltip -->
            <p id="tt-author" class="text-xs text-slate-400 italic mb-2 mt-1">Autor Desconhecido</p>
            <div class="flex flex-col gap-1 text-xs text-slate-300 border-t border-white/20 pt-2 mt-2">
                <span><strong class="text-slate-400">Instituição:</strong> <span id="tt-inst">Universidade</span></span>
                <span><strong class="text-slate-400">Ano:</strong> <span id="tt-year">2020</span></span>
                <span><strong class="text-slate-400">Tipo:</strong> <span id="tt-type">Artigo</span></span>
            </div>
        </div>

        <!-- Legenda Dinâmica Animada -->
        <div id="legend-container" class="absolute z-20 pointer-events-none glass-panel p-3 rounded-lg shadow-2xl" style="bottom: 16px; left: 16px; top: auto; right: auto;">
            <strong class="text-yellow-500 block mb-2 border-b border-white/10 pb-1 text-xs uppercase">Naipes (Instituições)</strong>
            <div id="legend-institutions" class="grid grid-cols-2 gap-x-6 gap-y-1 text-xs"></div>
        </div>
    </div>

    <script>
        // --- MAPEAMENTO DE INSTITUIÇÕES -> NAIPES ---
        const instSuits = {
            'Universidade do Minho': { symbol: '♥️', color: 'text-red-600' },
            'Universidade de Coimbra': { symbol: '♠️', color: 'text-slate-900' },
            'Universidade do Porto': { symbol: '♦️', color: 'text-red-600' },
            'ISCTE': { symbol: '♣️', color: 'text-slate-900' },
            'Universidade de Aveiro': { symbol: '⭐', color: 'text-amber-500' },
            'Universidade de Lisboa': { symbol: '🌙', color: 'text-blue-600' },
            'Universidade de Évora': { symbol: '☀️', color: 'text-orange-500' }
        };
        
        const extraSuits = [
            { symbol: '🎓', color: 'text-purple-600' }, { symbol: '🏛️', color: 'text-slate-700' },
            { symbol: '⚓', color: 'text-cyan-600' }, { symbol: '⚜️', color: 'text-indigo-600' },
            { symbol: '🧿', color: 'text-blue-500' }, { symbol: '💠', color: 'text-teal-500' },
            { symbol: '💎', color: 'text-sky-500' }, { symbol: '🧩', color: 'text-green-600' }
        ];
        let extraIndex = 0;

        function getSuitForInst(instName) {
            if (!instSuits[instName]) {
                instSuits[instName] = extraSuits[extraIndex % extraSuits.length];
                extraIndex++;
            }
            return instSuits[instName];
        }

        // --- Lógica de Upload ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('bg-black/80'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-black/80')); // Sintaxe corrigida aqui
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files.length) processFile(e.target.files[0]);
        });

        function processFile(file) {
            if (!file.name.endsWith('.csv')) { alert('Apenas CSV permitidos.'); return; }
            
            document.getElementById('upload-section').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('upload-section').style.display = 'none';
                const dash = document.getElementById('dashboard-section');
                dash.style.opacity = '1';
                dash.style.pointerEvents = 'auto';
            }, 700);

            Papa.parse(file, {
                header: true,
                delimiter: ";",
                skipEmptyLines: true,
                complete: function(results) {
                    dealCards(results.data);
                }
            });
        }

        let cardsData = [];
        let cardElements = [];

        function dealCards(rawData) {
            let validDocs = [];
            
            rawData.forEach((row, i) => {
                if (!row.title && !row.identifier) return;

                let year = row.year || row.result_year || '';
                let yMatch = String(year).match(/(?:19|20)\d{2}/);
                year = yMatch ? parseInt(yMatch[0]) : null;
                if (!year) return;

                let inst = row.institution_normalized || row.origin_repository || 'Desconhecida';
                if (inst.toLowerCase().includes('nova de lisboa') || inst.toLowerCase().includes('unl')) {
                    inst = 'ISCTE';
                }

                // Extração do Autor
                let author = row.primary_author || row.authors || 'Autor Desconhecido';
                if (author && author.length > 70) author = author.substring(0, 70) + '...';

                let suitData = getSuitForInst(inst);

                validDocs.push({
                    id: i,
                    title: row.title || 'Sem Título',
                    author: author,
                    abstract: row.abstract || 'Sem resumo disponível no documento.',
                    year: year,
                    inst: inst,
                    type: row.document_type_normalized || row.document_type || 'Outro',
                    suit: suitData.symbol,
                    suitColor: suitData.color
                });
            });

            updateLegend();
            validDocs.sort((a, b) => a.year - b.year);

            let deckSize = Math.min(validDocs.length, 104);
            let step = validDocs.length / deckSize;
            
            for(let i=0; i < deckSize; i++) {
                let index = Math.floor(i * step);
                let doc = validDocs[Math.min(index, validDocs.length - 1)];
                cardsData.push(doc);
            }

            document.getElementById('data-warning').innerHTML = `Mesa contém <b>${deckSize}</b> cartas representativas.`;
            createCardDOM();
        }

        function updateLegend() {
            const legendContainer = document.getElementById('legend-institutions');
            legendContainer.innerHTML = '';
            Object.keys(instSuits).forEach(inst => {
                const data = instSuits[inst];
                legendContainer.innerHTML += `
                    <p class="whitespace-nowrap flex items-center">
                        <span class="${data.color} w-5 inline-block text-center text-sm mr-1">${data.symbol}</span> 
                        <span class="truncate max-w-[120px] inline-block" title="${inst}">${inst}</span>
                    </p>
                `;
            });
        }

        function createCardDOM() {
            const container = document.getElementById('table-container');
            
            cardsData.forEach((data, index) => {
                let card = document.createElement('div');
                card.className = `playing-card`;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-front ${data.suitColor}">
                        <div class="card-top-left"><span>${data.year}</span><span>${data.suit}</span></div>
                        <div class="card-center">${data.suit}</div>
                        <div class="card-bottom-right"><span>${data.year}</span><span>${data.suit}</span></div>
                    </div>
                    <div class="card-back">
                        <div class="card-back-wrapper">
                            
                            <div class="close-btn absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center cursor-pointer shadow-md hover:scale-110 transition-transform z-10 text-lg">✕</div>
                            
                            <h3 class="text-xl font-bold text-slate-800 mb-1 pr-8 leading-snug">${data.title}</h3>
                            <p class="text-sm font-semibold text-slate-600 mb-3 italic flex items-center gap-1">
                                <i class="fa-solid fa-pen-nib"></i> ${data.author}
                            </p>
                            
                            <div class="abstract-text text-slate-700">
                                ${data.abstract}
                            </div>
                            
                            <div class="mt-4 pt-4 border-t border-slate-300 text-sm text-slate-500 font-bold flex justify-between items-center gap-2">
                                <span class="truncate pr-4">${data.inst}</span>
                                <span class="${data.suitColor} text-2xl">${data.suit}</span>
                            </div>

                        </div>
                    </div>
                `;

                // Eventos de Rato (Tooltip)
                card.addEventListener('mouseenter', (e) => {
                    if(!card.classList.contains('is-open')) {
                        card.style.zIndex = 500;
                        showTooltip(e, data);
                    }
                });
                card.addEventListener('mousemove', (e) => {
                    if(!card.classList.contains('is-open')) moveTooltip(e);
                });
                card.addEventListener('mouseleave', () => {
                    if(!card.classList.contains('is-open')) {
                        card.style.zIndex = data.zIndexMap || 1;
                        hideTooltip();
                    }
                });

                // Lógica de Expandir / Fechar
                card.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    if(e.target.closest('.close-btn')) {
                        closeAllCards();
                        return;
                    }
                    
                    if(!this.classList.contains('is-open')) {
                        closeAllCards(); 
                        hideTooltip();
                        
                        this.dataset.baseZindex = this.style.zIndex;
                        this.classList.add('is-open');
                        
                        let bd = document.getElementById('card-backdrop');
                        bd.classList.remove('opacity-0', 'pointer-events-none');
                        bd.classList.add('opacity-100', 'pointer-events-auto');
                    }
                });

                container.appendChild(card);
                cardElements.push(card);
            });

            arrangeCards('table');
        }

        function closeAllCards(e) {
            if (e && e.target.closest('.playing-card.is-open') && !e.target.closest('.close-btn')) {
                return; 
            }

            document.querySelectorAll('.playing-card.is-open').forEach(c => {
                c.classList.remove('is-open');
                c.style.zIndex = c.dataset.baseZindex || 1;
            });
            
            let bd = document.getElementById('card-backdrop');
            bd.classList.remove('opacity-100', 'pointer-events-auto');
            bd.classList.add('opacity-0', 'pointer-events-none');
        }

        // --- Lógicas de Layout ---
        function arrangeCards(layoutType) {
            closeAllCards(); 
            
            const container = document.getElementById('table-container');
            const markings = document.getElementById('table-markings');
            const legendContainer = document.getElementById('legend-container');
            markings.innerHTML = ''; 
            
            const w = container.clientWidth;
            const h = container.clientHeight;
            const cardW = 80; const cardH = 112;

            // ANIMAR A POSIÇÃO DA LEGENDA
            if (layoutType === 'suit') {
                // Vai para o Canto Superior Direito (escapa à header que tem ~80px de altura)
                legendContainer.style.bottom = 'auto';
                legendContainer.style.left = 'auto';
                legendContainer.style.top = '84px';
                legendContainer.style.right = '16px';
            } else {
                // Volta ao Canto Inferior Esquerdo
                legendContainer.style.top = 'auto';
                legendContainer.style.right = 'auto';
                legendContainer.style.bottom = '16px';
                legendContainer.style.left = '16px';
            }

            if (layoutType === 'table') {
                cardElements.forEach((card, i) => {
                    let x, y;
                    let safe = false;
                    let attempts = 0;
                    
                    // Loop de Anti-Colisão com a Legenda (Canto Inferior Esquerdo)
                    while (!safe && attempts < 100) {
                        x = Math.random() * (w - cardW - 100) + 50;
                        y = Math.random() * (h - cardH - 100) + 50;
                        
                        // Zonas proibidas (Legenda + Header)
                        // A legenda tem aprox 450px de largura e a área afeta é nos últimos 280px de altura
                        if ((x < 450 && y > h - 280) || y < 60) {
                            attempts++;
                        } else {
                            safe = true;
                        }
                    }
                    
                    let rot = (Math.random() * 60) - 30;
                    
                    card.style.left = `${x}px`;
                    card.style.top = `${y}px`;
                    card.style.transform = `rotate(${rot}deg)`;
                    card.style.zIndex = i;
                    cardsData[i].zIndexMap = i;
                });
            } 
            else if (layoutType === 'suit') {
                let suitsFound = Array.from(new Set(cardsData.map(d => d.suit)));
                
                let suitTotalCounts = {};
                cardsData.forEach(d => { suitTotalCounts[d.suit] = (suitTotalCounts[d.suit] || 0) + 1; });
                let maxCardsInRow = Math.max(...Object.values(suitTotalCounts));

                let suitCounts = {};
                suitsFound.forEach(s => suitCounts[s] = 0);
                
                let rowHeight = Math.min((h - 80) / suitsFound.length, cardH + 15);
                let startY = 40;

                let paddingLeft = 100; 
                let paddingRight = 40; 
                let availableW = w - paddingLeft - paddingRight - cardW;
                
                let stepX = maxCardsInRow > 1 ? availableW / (maxCardsInRow - 1) : 0;
                if (stepX > 50) stepX = 50;

                cardElements.forEach((card, i) => {
                    let data = cardsData[i];
                    let row = suitsFound.indexOf(data.suit);
                    let count = suitCounts[data.suit]++;
                    
                    let x = paddingLeft + (count * stepX); 
                    let y = startY + (row * rowHeight);
                    
                    card.style.left = `${x}px`;
                    card.style.top = `${y}px`;
                    card.style.transform = `rotate(0deg)`;
                    card.style.zIndex = count;
                    cardsData[i].zIndexMap = count;
                });

                suitsFound.forEach((suit, row) => {
                    let y = startY + (row * rowHeight) + (cardH/2) - 15;
                    markings.innerHTML += `<div class="absolute text-white/20 font-bold text-4xl left-6" style="top: ${y}px">${suit}</div>`;
                });
            }
            else if (layoutType === 'year') {
                let minYear = Math.min(...cardsData.map(d => d.year));
                let maxYear = Math.max(...cardsData.map(d => d.year));
                let range = maxYear - minYear;
                if (range === 0) range = 1; 
                
                let paddingX = 60;
                let availableW = w - (paddingX * 2) - cardW;
                
                let countsPerYear = {};

                cardElements.forEach((card, i) => {
                    let data = cardsData[i];
                    let yCount = countsPerYear[data.year] || 0;
                    countsPerYear[data.year] = yCount + 1;
                    
                    let x = paddingX + ((data.year - minYear) / range) * availableW;
                    let y = 60 + (yCount * 22); 
                    
                    card.style.left = `${x}px`;
                    card.style.top = `${y}px`;
                    card.style.transform = `rotate(0deg)`;
                    card.style.zIndex = yCount;
                    cardsData[i].zIndexMap = yCount;
                });

                let yearsSet = Array.from(new Set(cardsData.map(d => d.year)));
                
                markings.innerHTML += `<div class="absolute border-b border-white/20 w-full" style="bottom: 40px;"></div>`;
                
                yearsSet.forEach(yr => {
                    let x = paddingX + ((yr - minYear) / range) * availableW;
                    markings.innerHTML += `<div class="absolute text-yellow-500/50 font-bold text-lg text-center" style="left: ${x}px; width: ${cardW}px; bottom: 15px;">${yr}</div>`;
                });
            }
        }

        // --- Tooltips ---
        const tooltip = document.getElementById('tooltip');
        function showTooltip(e, data) {
            tooltip.style.opacity = 1;
            let rs = document.getElementById('tt-ranksuit');
            rs.innerText = `${data.year} ${data.suit}`;
            rs.className = `text-xs font-bold uppercase tracking-widest mb-1 ${data.suitColor}`;
            
            document.getElementById('tt-title').innerText = data.title;
            document.getElementById('tt-author').innerText = data.author;
            document.getElementById('tt-inst').innerText = data.inst;
            document.getElementById('tt-year').innerText = data.year;
            document.getElementById('tt-type').innerText = data.type;
        }
        function moveTooltip(e) {
            tooltip.style.left = e.pageX + 'px';
            tooltip.style.top = (e.pageY - 10) + 'px';
        }
        function hideTooltip() { tooltip.style.opacity = 0; }

        // --- Navegação ---
        document.querySelectorAll('.casino-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.casino-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                arrangeCards(this.getAttribute('data-group'));
            });
        });

        window.addEventListener('resize', () => {
            if(cardElements.length > 0) {
                let activeBtn = document.querySelector('.casino-btn.active');
                if(activeBtn) arrangeCards(activeBtn.getAttribute('data-group'));
            }
        });
    </script>
</body>
</html>
